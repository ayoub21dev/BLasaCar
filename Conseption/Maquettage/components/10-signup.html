<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - BlasaCar</title>
  <link rel="stylesheet" href="../styles/mockups.css">
</head>

<body class="mockup-embed">
  <main class="embed-pad">
    <section class="auth-wrap">
      <div class="surface auth-card">
        <img class="brand-logo" src="../../../public/assets/logoBlasaCar.png" alt="BlasaCar">
        <h1>Create an account</h1>
        <p>Join the community and start saving on your next trip.</p>
        <form class="form-stack" style="margin-top:32px;">
          <label class="input-shell">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <input type="text" placeholder="Full name">
          </label>
          <label class="input-shell">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
            <input type="tel" placeholder="Phone number">
          </label>
          <label class="input-shell">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="20" height="16" x="2" y="4" rx="2"></rect><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path></svg>
            <input type="email" placeholder="Email address">
          </label>
          <label class="input-shell">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="11" x="3" y="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
            <input type="password" placeholder="Create a password">
          </label>
          <button class="brand-button" type="button" style="width:100%;border-radius:20px;min-height:56px;font-size:16px;">Sign up</button>
        </form>
        <p class="auth-switch">Already have an account? <a href="11-login.html">Log in</a></p>
      </div>
    </section>
  </main>
</body>

</html>
