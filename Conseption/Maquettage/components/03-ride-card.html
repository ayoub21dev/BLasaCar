<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ride Card - BlasaCar</title>
  <link rel="stylesheet" href="../styles/mockups.css">
</head>

<body class="mockup-embed">
  <main class="embed-pad">
    <div class="ride-grid">
      <article class="ride-card">
        <a class="ride-card-inner" href="05-booking-card.html">
          <div class="driver-row">
            <div class="avatar-wrap">
              <img class="avatar" src="../../../public/assets/profiles/yassine.png" alt="Yassine">
              <span class="verified-dot">&#10003;</span>
            </div>
            <div>
              <p class="driver-name">Yassine E.</p>
              <div class="rating-row">&#9733; <span>4.9</span> <span style="color:var(--slate-300);">(58 trips)</span></div>
            </div>
          </div>
          <div class="route-row">
            <div class="route-time"><strong>08:00</strong><span>Casablanca</span></div>
            <div class="route-connector"><span class="route-dot-start"></span><span class="route-car">&#8761;</span></div>
            <div class="route-time end"><strong>09:15</strong><span>Rabat</span></div>
          </div>
          <div class="ride-footer">
            <div class="meta-row"><span>2 seats left</span><span>&bull;</span><span>Tue, Jul 7</span></div>
            <div class="price-row"><span class="price">70 DH</span><span class="book-pill">Book</span></div>
          </div>
        </a>
      </article>

      <article class="ride-card">
        <a class="ride-card-inner" href="05-booking-card.html">
          <div class="driver-row">
            <div class="avatar-wrap">
              <img class="avatar" src="../../../public/assets/profiles/mehdi-v2.png" alt="Mehdi">
              <span class="verified-dot">&#10003;</span>
            </div>
            <div>
              <p class="driver-name">Mehdi A.</p>
              <div class="rating-row">&#9733; <span>4.7</span> <span style="color:var(--slate-300);">(32 trips)</span></div>
            </div>
          </div>
          <div class="route-row">
            <div class="route-time"><strong>11:00</strong><span>Marrakech</span></div>
            <div class="route-connector"><span class="route-dot-start"></span><span class="route-car">&#8761;</span></div>
            <div class="route-time end"><strong>14:20</strong><span>Agadir</span></div>
          </div>
          <div class="ride-footer">
            <div class="meta-row"><span>4 seats left</span><span>&bull;</span><span>Sat, Jul 11</span></div>
            <div class="price-row"><span class="price">85 DH</span><span class="book-pill">Book</span></div>
          </div>
        </a>
      </article>
    </div>
  </main>
</body>

</html>
