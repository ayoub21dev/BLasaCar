<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trip Post Form - BlasaCar</title>
  <link rel="stylesheet" href="../styles/mockups.css">
</head>

<body class="mockup-embed">
  <main class="embed-pad">
    <div class="narrow">
      <section class="page-panel">
        <div class="page-panel-header">
          <h1 class="display-title" style="margin-top:0;">Publish a <span class="serif">ride</span>.</h1>
          <p>Share your journey, save on travel costs, and meet great people along the way.</p>
        </div>
        <form class="form-panel form-grid-publish">
          <label class="field wide">
            <span>Vehicle</span>
            <select class="select">
              <option>Dacia Logan</option>
              <option>Toyota Corolla</option>
            </select>
          </label>
          <label class="field">
            <span>From</span>
            <select class="select">
              <option>Casablanca</option>
              <option>Rabat</option>
            </select>
          </label>
          <label class="field">
            <span>To</span>
            <select class="select">
              <option>Rabat</option>
              <option>Fes</option>
            </select>
          </label>
          <label class="field">
            <span>Date</span>
            <input class="input" type="date" value="2026-07-07">
          </label>
          <label class="field">
            <span>Departure time</span>
            <input class="input" type="time" value="08:00">
          </label>
          <label class="field">
            <span>Seats offered</span>
            <select class="select">
              <option>1 seat</option>
              <option selected>2 seats</option>
              <option>3 seats</option>
              <option>4 seats</option>
            </select>
          </label>
          <label class="field">
            <span>Price per seat (DH)</span>
            <input class="input" type="number" value="70">
          </label>
          <label class="field wide">
            <span>Meeting point</span>
            <input class="input" type="text" value="Gare Casa Voyageurs">
          </label>
          <label class="field wide">
            <span>Notes</span>
            <textarea class="textarea">Departure near the main taxi lane. One medium bag per traveler.</textarea>
          </label>
          <div class="wide">
            <button class="brand-button" type="button" style="width:100%;border-radius:22px;min-height:56px;font-size:16px;">Publish my ride</button>
          </div>
        </form>
      </section>
    </div>
  </main>
</body>

</html>
