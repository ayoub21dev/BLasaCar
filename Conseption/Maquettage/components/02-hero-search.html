<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Search - BlasaCar</title>
  <link rel="stylesheet" href="../styles/mockups.css">
</head>

<body class="mockup-embed">
  <main class="embed-pad">
    <section class="shell">
      <div class="hero-shell hero-compact">
        <div class="hero-bg">
          <img src="../../../public/images/Heropage.png" alt="Moroccan cityscape">
        </div>
        <div class="hero-content">
          <div class="hero-grid-cols">
            <div>
              <h1 class="hero-title">Reliable Travel <br><span>Solutions</span></h1>
              <p class="hero-copy">Join thousands of Moroccans traveling together. Safe, reliable, and cost-effective carpooling for all your intercity trips.</p>
            </div>
            <aside class="search-card">
              <h2>Find your <br> ride today!</h2>
              <form class="form-stack">
                <label class="field">
                  <span class="overline">Leaving from</span>
                  <select class="select input-lg">
                    <option>Casablanca</option>
                    <option>Rabat</option>
                  </select>
                </label>
                <label class="field">
                  <span class="overline">Going to</span>
                  <select class="select input-lg">
                    <option>Rabat</option>
                    <option>Fes</option>
                  </select>
                </label>
                <div class="form-grid-2">
                  <label class="field">
                    <span class="overline">Date</span>
                    <input class="input input-lg" type="date" value="2026-07-07">
                  </label>
                  <label class="field">
                    <span class="overline">Seats</span>
                    <select class="select input-lg">
                      <option>1 seat</option>
                      <option>2 seats</option>
                    </select>
                  </label>
                </div>
                <button class="brand-button" type="button" style="min-height:80px;border-radius:16px;font-size:20px;">Find your ride</button>
              </form>
            </aside>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>

</html>
