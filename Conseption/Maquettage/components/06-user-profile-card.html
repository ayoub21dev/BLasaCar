<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile Card - BlasaCar</title>
  <link rel="stylesheet" href="../styles/mockups.css">
</head>

<body class="mockup-embed">
  <main class="embed-pad">
    <section class="profile-card">
      <div class="avatar-wrap">
        <img class="avatar lg" src="../../../public/assets/profiles/yassine.png" alt="Yassine">
        <span class="verified-dot">&#10003;</span>
      </div>
      <div style="min-width:0;flex:1;">
        <p class="overline" style="margin-left:0;">Driver profile</p>
        <h1 style="margin:8px 0 0;color:var(--slate-950);font-size:32px;font-weight:900;">Yassine ElMansouri</h1>
        <p style="margin:8px 0 0;color:var(--slate-500);font-size:15px;line-height:1.6;">Verified driver based in Casablanca. Frequent morning trips to Rabat with a Dacia Logan and clear pickup instructions.</p>
        <div class="data-pills">
          <span>4.9 rating</span>
          <span>58 trips</span>
          <span>CIN verified</span>
          <span>Dacia Logan</span>
        </div>
      </div>
      <a class="mini-button" href="05-booking-card.html">View ride</a>
    </section>
  </main>
</body>

</html>
