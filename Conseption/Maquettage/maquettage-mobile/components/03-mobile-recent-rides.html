<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Recent Rides - BlasaCar</title>
  <link rel="stylesheet" href="../../styles/mockups.css">
</head>

<body class="mockup-embed">
  <div class="mobile-app">
    <div class="mobile-screen" style="min-height:auto;box-shadow:none;">
      <main class="mobile-content">
        <section class="mobile-section">
          <div class="mobile-section-head">
            <h2>Leaving soon</h2>
            <a href="#" class="mobile-section-link">View all</a>
          </div>
          <div class="form-stack">
            <article class="mobile-ride-card">
              <div class="mobile-ride-head">
                <div class="driver-row">
                  <span class="avatar" style="width:44px;height:44px;background:var(--slate-950);color:#fff;">YE</span>
                  <div><p class="driver-name" style="font-size:14px;">Yassine ElMansouri</p><p style="margin:2px 0 0;color:var(--slate-500);font-size:12px;font-weight:700;">4.9 rating - Dacia Logan</p></div>
                </div>
                <span class="mobile-price">70 DH</span>
              </div>
              <div class="mobile-route">
                <div class="mobile-route-line"><span></span><i></i><span></span></div>
                <div class="mobile-route-copy">
                  <div><small>From</small><strong>Casablanca</strong></div>
                  <div><small>To</small><strong>Rabat</strong></div>
                </div>
              </div>
              <div class="mobile-tags"><span>Tue, Jul 7</span><span>08:00</span><span>2 seats left</span><span class="mobile-cta">Book -&gt;</span></div>
            </article>

            <article class="mobile-ride-card">
              <div class="mobile-ride-head">
                <div class="driver-row">
                  <span class="avatar" style="width:44px;height:44px;background:var(--slate-950);color:#fff;">SB</span>
                  <div><p class="driver-name" style="font-size:14px;">Sara Bennani</p><p style="margin:2px 0 0;color:var(--slate-500);font-size:12px;font-weight:700;">4.8 rating - Renault Clio</p></div>
                </div>
                <span class="mobile-price">95 DH</span>
              </div>
              <div class="mobile-route">
                <div class="mobile-route-line"><span></span><i></i><span></span></div>
                <div class="mobile-route-copy">
                  <div><small>From</small><strong>Rabat</strong></div>
                  <div><small>To</small><strong>Fes</strong></div>
                </div>
              </div>
              <div class="mobile-tags"><span>Fri, Jul 10</span><span>09:15</span><span>3 seats left</span><span class="mobile-cta">Book -&gt;</span></div>
            </article>
          </div>
        </section>
      </main>
    </div>
  </div>
</body>

</html>
