<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Hero Search - BlasaCar</title>
  <link rel="stylesheet" href="../../styles/mockups.css">
</head>

<body class="mockup-embed">
  <div class="mobile-app">
    <div class="mobile-screen" style="min-height:auto;box-shadow:none;">
      <main class="mobile-content">
        <section class="mobile-hero">
          <p class="mobile-kicker">Good to see you</p>
          <h1>Ayoub, where to?</h1>
          <p class="copy">Find a ride, check bookings, and keep your BlasaCar account close.</p>
          <div class="mobile-metrics">
            <div class="mobile-metric"><strong>4</strong><span>Rides</span></div>
            <div class="mobile-metric"><strong>120</strong><span>Cities</span></div>
            <div class="mobile-metric"><strong>4</strong><span>Seats max</span></div>
          </div>
        </section>

        <section class="mobile-section">
          <div class="mobile-section-head">
            <h2>Find a ride</h2>
            <a href="#" class="mobile-section-link">Advanced -&gt;</a>
          </div>
          <form class="mobile-search-form">
            <label class="mobile-field"><span>Leaving from</span><select class="mobile-input"><option>Casablanca</option></select></label>
            <label class="mobile-field"><span>Going to</span><select class="mobile-input"><option>Rabat</option></select></label>
            <div class="mobile-grid-2">
              <label class="mobile-field"><span>Date</span><input class="mobile-input" type="date" value="2026-07-07"></label>
              <label class="mobile-field"><span>Seats</span><select class="mobile-input"><option>1</option></select></label>
            </div>
            <button class="mobile-submit" type="button">Search rides</button>
          </form>
        </section>
      </main>
    </div>
  </div>
</body>

</html>
